server:
  port: 8080
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: identity
              uri: http://identity-service:8081
              predicates: [Path=/api/v1/auth/**]
            - id: company
              uri: http://company-service:8082
              predicates: [Path=/api/v1/companies/**]
            - id: fleet
              uri: http://fleet-service:8083
              predicates:
                - Path=/api/v1/vehicles/**,/api/v1/drivers/**
            - id: rental
              uri: http://rental-service:8084
              predicates:
                - Path=/api/v1/customers/**,/api/v1/bookings/**,/api/v1/payments/**,/api/v1/trips/**
          globalcors:
            corsConfigurations:
              '[/**]':
                allowedOrigins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
                allowedMethods: [GET,POST,PUT,PATCH,DELETE,OPTIONS]
                allowedHeaders: ["*"]
rentflow:
  jwt:
    issuer: ${JWT_ISSUER:rentflow}
    audience: ${JWT_AUDIENCE:rentflow-api}
    secret: ${JWT_SECRET:local-development-secret-that-must-be-replaced-with-256-bit-value}
